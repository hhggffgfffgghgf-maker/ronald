<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة الحجز - مصرف الوحدة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية التطبيق لمحاكاة شاشة الهاتف */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* القسم العلوي الأزرق */
        .top-section {
            background: linear-gradient(160deg, #2855cd 0%, #3247a3 100%);
            padding: 60px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        /* الشعار (اللوجو) */
        .logo-container {
            margin-bottom: 40px; 
        }
        
        .logo-container img {
            width: 330px; 
            height: auto;
            display: block;
        }

        /* القسم السفلي المظلم */
        .bottom-section {
            padding: 40px 20px 30px 20px; 
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* ----- تصميم الفاتورة (التي تحل محل الخانات) ----- */
        .invoice-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 25px 20px;
            margin-bottom: 25px;
            color: #222;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border-top: 6px solid #2855cd;
        }

        /* ترويسة الفاتورة */
        .invoice-header {
            text-align: center;
            border-bottom: 2px dashed #cccccc;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .invoice-header h3 {
            color: #2855cd;
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .invoice-header p {
            color: #777;
            font-size: 13px;
        }

        /* سطور بيانات الفاتورة */
        .invoice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .invoice-label {
            font-weight: 700;
            color: #555;
        }

        .invoice-value {
            font-weight: 700;
            color: #111;
            text-align: left;
        }

        /* ذيل الفاتورة (الختم والشعار) */
        .invoice-footer {
            margin-top: 30px;
            border-top: 2px dashed #cccccc;
            padding-top: 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* تصميم الختم */
        .stamp {
            width: 110px;
            height: 110px;
            border: 4px solid #d32f2f;
            border-radius: 50%;
            color: #d32f2f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            transform: rotate(-15deg);
            opacity: 0.8;
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.4;
        }
        
        .stamp span {
            font-size: 12px;
            font-weight: 500;
        }

        /* شعار المصرف بأسفل الفاتورة */
        .bottom-logo {
            width: 140px;
            height: auto;
            /* عكس الألوان لكي يظهر الشعار الأبيض بوضوح على الخلفية البيضاء */
            filter: invert(1) brightness(0.2); 
            margin-top: 10px;
        }

        /* تصميم صندوق التنبيه الأحمـر */
        .notice-card {
            background-color: #d32f2f;
            color: #ffffff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        /* زر الاستمرار / الحفظ */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #184bd6, #245ce8);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:active {
            opacity: 0.8;
        }

        .submit-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }
        
        /* إخفاء الزر والرسالة عند الطباعة */
        @media print {
            .submit-btn,
            .notice-card {
                display: none;
            }
            body {
                background-color: white;
            }
            .app-container {
                box-shadow: none;
                max-width: 100%;
            }
            .bottom-section {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- المساحة الزرقاء العلوية مع الشعار -->
        <div class="top-section">
            <div class="logo-container">
                <img src="https://i.imgur.com/UNIpHj3.png" id="bank-logo" alt="Bank Logo">
            </div>
        </div>

        <div class="bottom-section">
            
            <!-- صورة الفاتورة (الإيصال) -->
            <div class="invoice-card" id="invoice-content">
                <div class="invoice-header">
                    <h3>إيصال حجز مخصصات</h3>
                    <p id="date-text"></p>
                </div>
                
                <div class="invoice-body">
                    <div class="invoice-row">
                        <span class="invoice-label">نوع الحجز:</span>
                        <span class="invoice-value" id="val-type">أفراد</span>
                    </div>
                    <div class="invoice-row">
                        <span class="invoice-label">رقم الحساب:</span>
                        <span class="invoice-value" id="val-account">---</span>
                    </div>
                    <div class="invoice-row">
                        <span class="invoice-label">الرقم الوطني:</span>
                        <span class="invoice-value" id="val-national">---</span>
                    </div>
                    <div class="invoice-row">
                        <span class="invoice-label">رقم الهاتف:</span>
                        <span class="invoice-value" id="val-phone">---</span>
                    </div>
                    <div class="invoice-row">
                        <span class="invoice-label">رقم الجواز:</span>
                        <span class="invoice-value" id="val-passport">---</span>
                    </div>
                    <div class="invoice-row">
                        <span class="invoice-label">الفرع:</span>
                        <span class="invoice-value" id="val-branch">---</span>
                    </div>
                </div>

                <div class="invoice-footer">
                    <!-- الختم -->
                    <div class="stamp">
                        مُعـتـمـد<br>
                        <span>مصرف الوحدة</span>
                    </div>
                    
                    <!-- شعار مصرف الوحدة أسفل الفاتورة -->
                    <img src="https://i.imgur.com/UNIpHj3.png" alt="Wahda Bank" class="bottom-logo">
                </div>
            </div>

            <!-- رسالة التنبيه باللون الأبيض والخلفية الحمراء -->
            <div class="notice-card">
                سيتم التواصل معكم من قبل الموظف المختص في القسم من أجل حجز الدولار
            </div>

            <!-- زر لحفظ الشاشة كصورة أو طباعتها -->
            <button onclick="window.print()" class="submit-btn">
                <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                <span>حفظ الإيصال (طباعة)</span>
            </button>
            
        </div>
    </div>

    <script>
        // سحب البيانات من localStorage وعرضها في الفاتورة
        const bookingType = localStorage.getItem('selectedBookingType');
        document.getElementById('val-type').innerText = bookingType === 'companies' ? 'شركات' : 'أفراد';
        
        document.getElementById('val-account').innerText = localStorage.getItem('accountNumber') || 'لم يتم الإدخال';
        document.getElementById('val-national').innerText = localStorage.getItem('nationalId') || 'لم يتم الإدخال';
        document.getElementById('val-phone').innerText = localStorage.getItem('phoneNumber') || 'لم يتم الإدخال';
        document.getElementById('val-passport').innerText = localStorage.getItem('passportNumber') || 'لم يتم الإدخال';
        document.getElementById('val-branch').innerText = localStorage.getItem('branch') || 'لم يتم التحديد';
        
        // تعيين التاريخ والوقت الحاليين للإيصال
        const dateObj = new Date();
        const dateString = dateObj.toLocaleDateString('ar-LY');
        const timeString = dateObj.toLocaleTimeString('ar-LY', {hour: '2-digit', minute:'2-digit'});
        document.getElementById('date-text').innerText = dateString + ' م  |  ' + timeString;
    </script>
</body>
</html>
